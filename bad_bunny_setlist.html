<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Bunny — Madrid Setlist 🐰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --accent: #c8f23a;
    --accent2: #ff3c6e;
    --text: #f0f0f0;
    --muted: #888;
    --border: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a0a 50%, #0a1a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .logo { font-size: 28px; }

  h1 {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .concert-info {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .search-bar {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--accent); }
  .search-bar::placeholder { color: var(--muted); }

  .filters {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Space Grotesk', sans-serif;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }

  .progress-bar {
    margin-top: 10px;
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'Space Mono', monospace;
  }

  main { padding: 12px; max-width: 800px; margin: 0 auto; }

  .song-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .song-card:hover { border-color: #3a3a3a; }
  .song-card.learned { border-color: var(--accent) !important; }

  .song-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    gap: 12px;
    user-select: none;
  }

  .song-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 22px;
  }

  .song-info { flex: 1; }

  .song-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .song-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .album-tag {
    display: inline-block;
    background: var(--surface2);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
    font-family: 'Space Mono', monospace;
  }

  .song-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .check-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
    color: var(--muted);
  }
  .check-btn.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .expand-icon {
    color: var(--muted);
    font-size: 18px;
    transition: transform 0.3s;
    line-height: 1;
  }
  .song-card.open .expand-icon { transform: rotate(180deg); }

  .song-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }
  .song-card.open .song-body { display: block; }

  .tabs {
    display: flex;
    gap: 0;
    margin: 14px 0 12px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Context tab */
  .context-section {
    margin-bottom: 14px;
  }
  .context-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }
  .context-text {
    font-size: 13px;
    color: #ccc;
    line-height: 1.6;
  }

  /* Lyrics tab */
  .lyrics-container {
    font-size: 13px;
    line-height: 1.8;
  }

  .lyric-line {
    display: flex;
    gap: 12px;
    padding: 2px 0;
    border-radius: 4px;
  }
  .lyric-line:hover { background: var(--surface2); }

  .lyric-es {
    flex: 1;
    color: #ddd;
  }
  .lyric-fr {
    flex: 1;
    color: var(--muted);
    font-style: italic;
  }

  .lyric-line.key-line .lyric-es {
    color: var(--accent);
    font-weight: 700;
  }
  .lyric-line.key-line .lyric-fr {
    color: #a8d420;
    font-style: normal;
    font-weight: 600;
  }

  .lyric-section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 0 4px;
    display: block;
  }

  .lyrics-header {
    display: flex;
    gap: 12px;
    padding: 0 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .lyrics-header span {
    flex: 1;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
  }

  /* Tips tab */
  .tip-item {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: flex-start;
  }
  .tip-icon {
    font-size: 18px;
    min-width: 24px;
    margin-top: 1px;
  }
  .tip-text {
    font-size: 13px;
    color: #ccc;
    line-height: 1.5;
  }
  .tip-text strong { color: var(--accent); }

  .difficulty-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 12px;
    font-family: 'Space Mono', monospace;
  }
  .diff-easy { background: #1a3a1a; color: #4caf50; }
  .diff-medium { background: #3a2a00; color: #ffc107; }
  .diff-hard { background: #3a0a1a; color: var(--accent2); }

  .key-phrase-box {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    margin: 10px 0;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Space Mono', monospace;
  }

  .legend {
    display: flex;
    gap: 16px;
    padding: 10px 16px;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  .legend-dot.pink { background: var(--accent2); }
</style>
</head>

// State
let learned = JSON.parse(localStorage.getItem('bb_learned') || '[]');
let currentFilter = 'all';
let openCards = new Set();

function saveState() {
  localStorage.setItem('bb_learned', JSON.stringify(learned));
}

function updateProgress() {
  const pct = (learned.length / songs.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${learned.length} / ${songs.length} chansons apprises`;
}

function toggleLearn(id, event) {
  event.stopPropagation();
  if (learned.includes(id)) {
    learned = learned.filter(x => x !== id);
  } else {
    learned.push(id);
  }
  saveState();
  renderSongs();
  updateProgress();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSongs();
}

function filterSongs() {
  renderSongs();
}

function toggleCard(id) {
  if (openCards.has(id)) {
    openCards.delete(id);
  } else {
    openCards.add(id);
  }
  renderSongs();
}

function switchTab(cardId, tab) {
  const card = document.getElementById('card-' + cardId);
  card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  card.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  card.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  card.querySelector('#tc-' + tab + '-' + cardId).classList.add('active');
}

function getDiffLabel(d) {
  if (d === 'easy') return '🟢 Facile';
  if (d === 'medium') return '🟡 Moyen';
  return '🔴 Difficile';
}
function getDiffClass(d) {
  if (d === 'easy') return 'diff-easy';
  if (d === 'medium') return 'diff-medium';
  return 'diff-hard';
}

function renderSongs() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('songList');

  const filtered = songs.filter(s => {
    const matchSearch = !search || s.title.toLowerCase().includes(search) || (s.feat || '').toLowerCase().includes(search);
    const isLearned = learned.includes(s.id);
    const matchFilter =
      currentFilter === 'all' ? true :
      currentFilter === 'easy' ? s.difficulty === 'easy' :
      currentFilter === 'medium' ? s.difficulty === 'medium' :
      currentFilter === 'hard' ? s.difficulty === 'hard' :
      currentFilter === 'learned' ? isLearned : true;
    return matchSearch && matchFilter;
  });

  list.innerHTML = filtered.map((s, idx) => {
    const isLearned = learned.includes(s.id);
    const isOpen = openCards.has(s.id);

    const lyricsHtml = s.lyrics.map(l => {
      if (l.section !== undefined) {
        return `<span class="lyric-section-label">${l.section}</span>`;
      }
      return `<div class="lyric-line${l.key ? ' key-line' : ''}">
        <span class="lyric-es">${l.key ? '<strong>' : ''}${l.es}${l.key ? '</strong>' : ''}</span>
        <span class="lyric-fr">${l.fr}</span>
      </div>`;
    }).join('');

    const tipsHtml = s.tips.map(t => `
      <div class="tip-item">
        <span class="tip-icon">${t.icon}</span>
        <span class="tip-text">${t.text}</span>
      </div>
    `).join('');

    return `
    <div class="song-card${isLearned ? ' learned' : ''}${isOpen ? ' open' : ''}" id="card-${s.id}">
      <div class="song-header" onclick="toggleCard(${s.id})">
        <span class="song-number">${String(idx + 1).padStart(2, '0')}</span>
        <div class="song-info">
          <div class="song-title">${s.title}${s.feat ? ` <span style="font-weight:400;color:var(--muted);font-size:12px">ft. ${s.feat}</span>` : ''}</div>
          <div class="song-meta">${s.album} · ${s.year}<span class="album-tag">${getDiffLabel(s.difficulty)}</span></div>
        </div>
        <div class="song-actions">
          <button class="check-btn${isLearned ? ' done' : ''}" onclick="toggleLearn(${s.id}, event)" title="Marquer comme apprise">
            ${isLearned ? '✓' : '○'}
          </button>
          <span class="expand-icon">›</span>
        </div>
      </div>
      ${isOpen ? `
      <div class="song-body">
        <div class="tabs">
          <div class="tab active" data-tab="context" onclick="switchTab(${s.id}, 'context')">📖 Contexte</div>
          <div class="tab" data-tab="lyrics" onclick="switchTab(${s.id}, 'lyrics')">🎤 Paroles</div>
          <div class="tab" data-tab="tips" onclick="switchTab(${s.id}, 'tips')">💡 Tips</div>
        </div>

        <div class="tab-content active" id="tc-context-${s.id}">
          <div class="context-section">
            <div class="context-label">📍 Contexte & Histoire</div>
            <div class="context-text">${s.context}</div>
          </div>
          <div class="context-section">
            <div class="context-label">🎭 Ambiance</div>
            <div class="context-text">${s.vibe}</div>
          </div>
          <div class="context-section">
            <div class="context-label">🔑 Phrase clé à retenir</div>
            <div class="key-phrase-box">${s.keyPhrase}</div>
          </div>
        </div>

        <div class="tab-content" id="tc-lyrics-${s.id}">
          <div class="difficulty-badge ${getDiffClass(s.difficulty)}">${getDiffLabel(s.difficulty)}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-family:'Space Mono',monospace;">
            🟢 Lignes en vert = à apprendre par cœur
          </div>
          <div class="lyrics-container">
            <div class="lyrics-header">
              <span>🇵🇷 Original</span>
              <span>🇫🇷 Traduction</span>
            </div>
            ${lyricsHtml}
          </div>
        </div>

        <div class="tab-content" id="tc-tips-${s.id}">
          ${tipsHtml}
        </div>
      </div>
      ` : ''}
    </div>`;
  }).join('');
}

renderSongs();
updateProgress();
</script>
